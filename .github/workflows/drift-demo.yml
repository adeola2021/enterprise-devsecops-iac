name: Terraform Drift Demo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  drift-demo:
    name: Drift Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::011122914928:role/GitHubActions-Terraform-DriftDetection
          aws-region: us-east-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: drift-demo
        run: |
          terraform init \
            -backend-config="bucket=enterprise-devsecops-tfstate-011122914928" \
            -backend-config="key=drift-demo/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Validate
        working-directory: drift-demo
        run: terraform validate

      - name: Verify live SSM value
        run: |
          aws ssm get-parameter \
            --region us-east-1 \
            --name "/enterprise-devsecops/drift-demo" \
            --query 'Parameter.[Name,Value,Version]' \
            --output table

      - name: Terraform Drift Check
        id: drift
        working-directory: drift-demo
        shell: bash
        run: |
          set +e

          terraform plan \
            -input=false \
            -detailed-exitcode \
            -no-color \
            -out=tfplan > drift-output.txt 2>&1

          EXIT_CODE=$?

          echo "Terraform plan exit code: $EXIT_CODE"
          cat drift-output.txt

          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "status=NO_DRIFT" >> "$GITHUB_OUTPUT"
            echo "✅ No infrastructure drift detected."

          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "status=DRIFT_DETECTED" >> "$GITHUB_OUTPUT"
            echo "⚠️ Infrastructure changes or drift detected."

          else
            echo "status=PLAN_ERROR" >> "$GITHUB_OUTPUT"
            echo "❌ Terraform plan failed."
          fi

          exit 0

      - name: Prepare Drift Summary
        if: steps.drift.outputs.exit_code == '2'
        id: summary
        working-directory: drift-demo
        shell: bash
        run: |
          {
            echo "summary<<EOF"
            tail -n 25 drift-output.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send Slack Drift Alert
        if: steps.drift.outputs.exit_code == '2'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRIFT_SUMMARY: ${{ steps.summary.outputs.summary }}
        shell: bash
        run: |
          PAYLOAD=$(jq -n \
            --arg repository "${{ github.repository }}" \
            --arg workflow "${{ github.workflow }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg actor "${{ github.actor }}" \
            --arg summary "$DRIFT_SUMMARY" \
            '{
              text:
                ("🚨 *TERRAFORM DRIFT DETECTED*\n\n" +
                 "*Repository:* " + $repository + "\n" +
                 "*Workflow:* " + $workflow + "\n" +
                 "*Branch:* " + $branch + "\n" +
                 "*Terraform Exit Code:* 2\n" +
                 "*Status:* DRIFT DETECTED\n" +
                 "*Triggered by:* " + $actor + "\n" +
                 "*Run ID:* " + $run_id + "\n\n" +
                 "*Drift Summary:*\n```" + $summary + "```")
            }')

          curl --fail-with-body \
            -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"

      - name: Enforce Drift Result
        if: always()
        shell: bash
        run: |
          EXIT_CODE="${{ steps.drift.outputs.exit_code }}"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ Infrastructure matches Terraform configuration."
            exit 0

          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "❌ Drift detected. Slack alert dispatched."
            exit 2

          else
            echo "❌ Terraform plan execution failed."
            exit 1
          fi
