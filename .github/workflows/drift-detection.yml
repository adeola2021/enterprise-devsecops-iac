name: Terraform Drift Detection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  drift-detection:
    name: Detect Terraform Drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::011122914928:role/GitHubActions-Terraform-DriftDetection
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Discover AWS resources
        shell: bash
        run: |
          set -e

          echo "Discovering default VPC..."

          VPC_ID=$(aws ec2 describe-vpcs \
            --region us-east-1 \
            --filters "Name=is-default,Values=true" \
            --query 'Vpcs[0].VpcId' \
            --output text)

          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "❌ No default VPC found."
            exit 1
          fi

          echo "VPC_ID=$VPC_ID"

          echo "Discovering subnet..."

          SUBNET_ID=$(aws ec2 describe-subnets \
            --region us-east-1 \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=state,Values=available" \
            --query 'Subnets | sort_by(@, &AvailabilityZone)[0].SubnetId' \
            --output text)

          if [ "$SUBNET_ID" = "None" ] || [ -z "$SUBNET_ID" ]; then
            echo "❌ No available subnet found in VPC $VPC_ID."
            exit 1
          fi

          echo "SUBNET_ID=$SUBNET_ID"

          echo "Discovering latest Amazon Linux 2023 AMI..."

          AMI_ID=$(aws ec2 describe-images \
            --region us-east-1 \
            --owners amazon \
            --filters \
              "Name=name,Values=al2023-ami-*-x86_64" \
              "Name=state,Values=available" \
            --query 'Images | sort_by(@, &CreationDate)[-1].ImageId' \
            --output text)

          if [ "$AMI_ID" = "None" ] || [ -z "$AMI_ID" ]; then
            echo "❌ No suitable Amazon Linux 2023 AMI found."
            exit 1
          fi

          echo "AMI_ID=$AMI_ID"

          echo "TF_VAR_vpc_id=$VPC_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_subnet_id=$SUBNET_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_application_ami=$AMI_ID" >> "$GITHUB_ENV"

      - name: Show selected Terraform inputs
        run: |
          echo "VPC: $TF_VAR_vpc_id"
          echo "Subnet: $TF_VAR_subnet_id"
          echo "AMI: $TF_VAR_application_ami"
          echo "Database password: configured as GitHub Secret"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Drift Check
        working-directory: terraform
        shell: bash
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          set +e

          terraform plan \
            -input=false \
            -detailed-exitcode \
            -out=tfplan

          EXIT_CODE=$?

          echo "Terraform plan exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ No infrastructure drift detected."
            exit 0
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "⚠️ Infrastructure changes/drift detected."
            exit 2
          else
            echo "❌ Terraform plan failed."
            exit 1
          fi
