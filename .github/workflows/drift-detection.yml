name: Terraform Drift Detection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  id-token: write
  contents: read

jobs:

  bootstrap-state:
    name: Bootstrap Terraform State
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::011122914928:role/GitHubActions-Terraform-DriftDetection
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Create Terraform state bucket
        shell: bash
        run: |
          set -e

          BUCKET_NAME="enterprise-devsecops-tfstate-011122914928"

          echo "Terraform state bucket: $BUCKET_NAME"

          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "✅ State bucket already exists."
          else
            echo "Creating Terraform state bucket..."

            aws s3api create-bucket \
              --bucket "$BUCKET_NAME" \
              --region us-east-1

            echo "✅ State bucket created."
          fi

          echo "Enabling versioning..."

          aws s3api put-bucket-versioning \
            --bucket "$BUCKET_NAME" \
            --versioning-configuration Status=Enabled

          echo "Blocking public access..."

          aws s3api put-public-access-block \
            --bucket "$BUCKET_NAME" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

          echo "Enabling default encryption..."

          aws s3api put-bucket-encryption \
            --bucket "$BUCKET_NAME" \
            --server-side-encryption-configuration \
              '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'

          echo "✅ Terraform state bucket configuration completed."

  drift-detection:
    name: Detect Terraform Drift
    runs-on: ubuntu-latest
    needs: bootstrap-state

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::011122914928:role/GitHubActions-Terraform-DriftDetection
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Discover AWS resources
        id: discovery
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "AWS RESOURCE DISCOVERY"
          echo "=========================================="

          echo "Discovering default VPC..."

          VPC_ID=$(aws ec2 describe-vpcs \
            --region us-east-1 \
            --filters "Name=is-default,Values=true" \
            --query 'Vpcs[0].VpcId' \
            --output text)

          if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
            echo "❌ No default VPC found."
            exit 1
          fi

          echo "VPC_ID=$VPC_ID"

          echo "Discovering subnet..."

          SUBNET_ID=$(aws ec2 describe-subnets \
            --region us-east-1 \
            --filters \
              "Name=vpc-id,Values=$VPC_ID" \
              "Name=state,Values=available" \
            --query 'Subnets | sort_by(@, &AvailabilityZone)[0].SubnetId' \
            --output text)

          if [ "$SUBNET_ID" = "None" ] || [ -z "$SUBNET_ID" ]; then
            echo "❌ No available subnet found."
            exit 1
          fi

          echo "SUBNET_ID=$SUBNET_ID"

          echo "Discovering latest Amazon Linux 2023 AMI..."

          AMI_ID=$(aws ec2 describe-images \
            --region us-east-1 \
            --owners amazon \
            --filters \
              "Name=name,Values=al2023-ami-*-x86_64" \
              "Name=state,Values=available" \
            --query 'Images | sort_by(@, &CreationDate)[-1].ImageId' \
            --output text)

          if [ "$AMI_ID" = "None" ] || [ -z "$AMI_ID" ]; then
            echo "❌ No suitable Amazon Linux 2023 AMI found."
            exit 1
          fi

          echo "AMI_ID=$AMI_ID"

          # Persist values for subsequent GitHub Actions steps
          echo "DISCOVERED_VPC_ID=$VPC_ID" >> "$GITHUB_ENV"
          echo "DISCOVERED_SUBNET_ID=$SUBNET_ID" >> "$GITHUB_ENV"
          echo "DISCOVERED_AMI_ID=$AMI_ID" >> "$GITHUB_ENV"

          # Also expose them as step outputs
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"
          echo "subnet_id=$SUBNET_ID" >> "$GITHUB_OUTPUT"
          echo "application_ami=$AMI_ID" >> "$GITHUB_OUTPUT"

          echo
          echo "=========================================="
          echo "DISCOVERY COMPLETE"
          echo "=========================================="
          echo "DISCOVERED_VPC_ID=$VPC_ID"
          echo "DISCOVERED_SUBNET_ID=$SUBNET_ID"
          echo "DISCOVERED_AMI_ID=$AMI_ID"
          echo "=========================================="

      - name: Verify discovered Terraform variables
        run: |
          echo "VPC ID: ${{ steps.discovery.outputs.vpc_id }}"
          echo "Subnet ID: ${{ steps.discovery.outputs.subnet_id }}"
          echo "Application AMI: ${{ steps.discovery.outputs.application_ami }}"

          if [ -z "${{ steps.discovery.outputs.vpc_id }}" ]; then
            echo "❌ VPC ID is missing."
            exit 1
          fi

          if [ -z "${{ steps.discovery.outputs.subnet_id }}" ]; then
            echo "❌ Subnet ID is missing."
            exit 1
          fi

          if [ -z "${{ steps.discovery.outputs.application_ami }}" ]; then
            echo "❌ Application AMI is missing."
            exit 1
          fi

          echo "✅ All Terraform variables are available."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=enterprise-devsecops-tfstate-011122914928" \
            -backend-config="key=enterprise-devsecops/terraform.tfstate" \
            -backend-config="region=us-east-1"

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Drift Check
        working-directory: terraform
        shell: bash
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
        run: |
          set +e

          echo "=========================================="
          echo "Terraform Drift Detection"
          echo "=========================================="

          echo "VPC ID: $DISCOVERED_VPC_ID"
          echo "Subnet ID: $DISCOVERED_SUBNET_ID"
          echo "AMI ID: $DISCOVERED_AMI_ID"

          echo
          echo "Checking required values..."

          if [ -z "$DISCOVERED_VPC_ID" ]; then
            echo "❌ VPC ID is empty"
            exit 1
          fi

          if [ -z "$DISCOVERED_SUBNET_ID" ]; then
            echo "❌ Subnet ID is empty"
            exit 1
          fi

          if [ -z "$DISCOVERED_AMI_ID" ]; then
            echo "❌ AMI ID is empty"
            exit 1
          fi

          echo "✅ All AWS resource values are available."

          echo
          echo "Running Terraform plan..."

          terraform plan \
            -input=false \
            -detailed-exitcode \
            -var="vpc_id=$DISCOVERED_VPC_ID" \
            -var="subnet_id=$DISCOVERED_SUBNET_ID" \
            -var="application_ami=$DISCOVERED_AMI_ID" \
            -out=tfplan

          EXIT_CODE=$?

          echo
          echo "Terraform plan exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ No infrastructure drift detected."
            exit 0
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "⚠️ Infrastructure changes/drift detected."
            exit 2
          else
            echo "❌ Terraform plan failed."
            exit 1
          fi
