name: IaC Security Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  iac-security:
    name: IaC Security Checks
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. Setup Terraform
      # --------------------------------------------------
      - name: Set up Python for Threat Modeling
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyTM and Graphviz
        run: |
          python -m pip install pytm==1.3.1
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Generate PyTM Threat Model
        run: |
          set -euo pipefail
          mkdir -p reports/phase4

          python threat-model/threat_model.py \
            --json reports/phase4/threat-model.json

          python threat-model/threat_model.py \
            --dfd > reports/phase4/architecture-dfd.dot

          dot -Tpng \
            reports/phase4/architecture-dfd.dot \
            -o reports/phase4/architecture-dfd.png

          python threat-model/generate_report.py \
            --input reports/phase4/threat-model.json \
            --output reports/phase4/threat-report.md

      - name: Validate PyTM Threat Report
        run: |
          python -m json.tool reports/phase4/threat-model.json > /dev/null
          test -s reports/phase4/architecture-dfd.png
          test -s reports/phase4/threat-report.md

      - name: Upload PyTM Security Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-pytm-threat-model
          path: reports/phase4/
          if-no-files-found: error
          retention-days: 30

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.0"
          terraform_wrapper: false

      # --------------------------------------------------
      # 3. Terraform Format Check
      # --------------------------------------------------
      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      # --------------------------------------------------
      # 4. Terraform Initialization
      # --------------------------------------------------
      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      # --------------------------------------------------
      # 5. Terraform Validation
      # --------------------------------------------------
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # --------------------------------------------------
      # 6. Gitleaks Secret Scanning
      # --------------------------------------------------
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --------------------------------------------------
      # 7. Checkov IaC Security Scan
      # --------------------------------------------------
      - name: Checkov Terraform Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform
          quiet: false

      # --------------------------------------------------
      # Phase 4: Semgrep and Checkov SARIF Integration
      # --------------------------------------------------
      - name: Install Phase 4 Security Scanners
        run: |
          python -m pip install semgrep==1.175.0 checkov==3.3.15

      - name: Run Semgrep Terraform Scan
        run: |
          mkdir -p reports/phase4/sast
          semgrep scan \
            --config p/terraform \
            --include '*.tf' \
            --sarif \
            --sarif-output reports/phase4/sast/semgrep.sarif \
            --metrics=off \
            .

      - name: Run Checkov Repository Scan
        run: |
          mkdir -p reports/phase4/sast/checkov
          checkov \
            --directory . \
            --framework terraform \
            --output sarif \
            --output-file-path reports/phase4/sast/checkov \
            --soft-fail

      - name: Validate Phase 4 SARIF Reports
        run: |
          python - <<'SARIF'
          import json
          from pathlib import Path

          paths = [
              Path("reports/phase4/sast/semgrep.sarif"),
              Path("reports/phase4/sast/checkov/results_sarif.sarif"),
          ]

          for path in paths:
              assert path.is_file(), f"Missing SARIF: {path}"
              data = json.loads(path.read_text())
              assert data.get("version") == "2.1.0", f"Invalid SARIF: {path}"
              print(f"Validated: {path}")
          SARIF

      - name: Upload Phase 4 SARIF Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-sast-sarif
          path: |
            reports/phase4/sast/semgrep.sarif
            reports/phase4/sast/checkov/results_sarif.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Semgrep to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/phase4/sast/semgrep.sarif
          category: phase4-semgrep

      - name: Upload Checkov to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/phase4/sast/checkov/results_sarif.sarif
          category: phase4-checkov

      # --------------------------------------------------
      # 8. Install Conftest
      # --------------------------------------------------
      - name: Install Conftest
        run: |
          CONFTEST_VERSION="0.69.0"
          curl -L \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            -o conftest.tar.gz
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/
          conftest --version

      # --------------------------------------------------
      # 9. Run OPA/Conftest Policy Test
      # --------------------------------------------------
      - name: OPA Policy Enforcement
        run: |
          echo "=========================================="
          echo " Phase 1 OPA Policy Validation"
          echo "=========================================="

          conftest test \
            terraform-policy-test/tfplan-compliant.json \
            --policy policy/

          echo
          echo "=========================================="
          echo " Phase 2 Advanced OPA Policy Validation"
          echo "=========================================="

          conftest test \
            terraform-policy-test/tfplan-phase2-compliant.json \
            --policy policy/

      # --------------------------------------------------
      # --------------------------------------------------
      # Phase 4: Genuine AWS Terraform Plan Security Gate
      # --------------------------------------------------
      - name: Phase 4 Real AWS Plan Policy Gate
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail

          for module in aws-secure-plan aws-real-plan; do
            echo "=========================================="
            echo " Generating AWS plan: ${module}"
            echo "=========================================="

            terraform -chdir="terraform-policy-test/${module}" init \
              -backend=false \
              -input=false \
              -lockfile=readonly

            terraform -chdir="terraform-policy-test/${module}" validate

            terraform -chdir="terraform-policy-test/${module}" plan \
              -refresh=false \
              -input=false \
              -lock=false \
              -out=tfplan

            terraform -chdir="terraform-policy-test/${module}" show \
              -json tfplan \
              > "terraform-policy-test/${module}/tfplan.json"
          done

          python scripts/verify_phase4_policy.py

      # 10. Security Pipeline Summary
      # --------------------------------------------------
      - name: Security Pipeline Summary
        if: success()
        run: |
          echo "=========================================="
          echo " IaC SECURITY PIPELINE PASSED"
          echo "=========================================="
          echo "Terraform format: PASSED"
          echo "Terraform validation: PASSED"
          echo "Gitleaks: PASSED"
          echo "Checkov: PASSED"
          echo "OPA/Conftest Phase 1: PASSED"
          echo "OPA/Conftest Phase 2: PASSED"
          echo "Phase 4 genuine AWS plan policy gate: PASSED"
          echo "=========================================="
