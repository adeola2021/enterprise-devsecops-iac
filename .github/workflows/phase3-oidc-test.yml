name: Phase 3 OIDC Validation

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-validation:
    name: AWS OIDC Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::011122914928:role/GitHubActions-Terraform-DriftDetection
          aws-region: us-east-1
          role-session-name: Phase3OIDCValidation

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Inspect existing role
        shell: bash
        run: |
          set +e

          echo "=== ROLE DETAILS ==="
          aws iam get-role \
            --role-name GitHubActions-Terraform-DriftDetection \
            --query 'Role.[RoleName,Arn,MaxSessionDuration,AssumeRolePolicyDocument]' \
            --output json

          echo
          echo "=== ATTACHED MANAGED POLICIES ==="
          aws iam list-attached-role-policies \
            --role-name GitHubActions-Terraform-DriftDetection \
            --output table

          echo
          echo "=== INLINE POLICIES ==="
          aws iam list-role-policies \
            --role-name GitHubActions-Terraform-DriftDetection \
            --output table

          exit 0
